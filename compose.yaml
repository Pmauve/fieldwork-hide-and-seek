services:
  jetlag-map:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:${FIELDWORK_PORT:-9130}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./layout.css:/usr/share/nginx/html/layout.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./geometry.js:/usr/share/nginx/html/geometry.js:ro
      - ./measurement-worker.js:/usr/share/nginx/html/measurement-worker.js:ro
      - ./login.html:/usr/share/nginx/html/login.html:ro
      - ./login.js:/usr/share/nginx/html/login.js:ro
      - ./login.css:/usr/share/nginx/html/login.css:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./vendor:/usr/share/nginx/html/vendor:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    depends_on:
      api:
        condition: service_healthy

  api:
    image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    command: ["python", "-u", "/app/server.py"]
    environment:
      DATA_DIR: /data
      PYTHONDONTWRITEBYTECODE: "1"
      AUTH_CONFIG_FILE: /run/secrets/fieldwork-auth.json
    volumes:
      - ./server.py:/app/server.py:ro
      - ./auth.py:/app/auth.py:ro
      - ./secrets/auth.json:/run/secrets/fieldwork-auth.json:ro
      - ./data:/data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
