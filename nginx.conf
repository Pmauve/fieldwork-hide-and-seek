worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  limit_req_zone $server_name zone=login_limit:1m rate=10r/m;
  limit_req_zone $server_name zone=api_limit:1m rate=10r/s;
  limit_req_status 429;
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;
    client_body_timeout 15s;
    auth_request /_auth;
    error_page 401 =302 /login;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org https://services.arcgisonline.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location = /_auth {
      internal;
      auth_request off;
      proxy_pass http://api:8081/auth/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $http_host;
    }
    location = /login { auth_request off; try_files /login.html =404; }
    location = /login.js { auth_request off; try_files $uri =404; }
    location = /login.css { auth_request off; try_files $uri =404; }
    location = /auth/login {
      auth_request off;
      client_max_body_size 2k;
      limit_req zone=login_limit burst=10 nodelay;
      proxy_pass http://api:8081;
      proxy_set_header Host $http_host;
    }
    location /auth/ {
      auth_request off;
      proxy_pass http://api:8081;
      proxy_set_header Host $http_host;
    }
    location /api/ {
      error_page 401 = @unauthorized;
      limit_req zone=api_limit burst=50 nodelay;
      proxy_pass http://api:8081;
      proxy_read_timeout 30s;
      proxy_set_header Host $http_host;
    }
    location @unauthorized {
      auth_request off;
      default_type application/json;
      return 401 '{"error":"Sign in required"}';
    }
    location / { try_files $uri $uri/ =404; }
  }
}
